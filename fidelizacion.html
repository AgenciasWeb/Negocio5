<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de Fidelización</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>

    <main class="card">
        <div style="text-align: left; margin-bottom: 10px;">
            <a href="index.html" style="color: #a0a0a0; text-decoration: none; font-size: 14px; font-family: 'Inter', sans-serif;">← Volver</a>
        </div>

        <h2>Club de Fidelización</h2>
        <p>Ingresá tus datos para ver tus cruces acumuladas.</p>

        <!-- Formulario de Registro / Ingreso -->
        <div id="form-registro">
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-size: 14px; color: #a0a0a0; font-family: 'Inter', sans-serif;">Tu Nombre:</label>
                <input type="text" id="nombreCliente" placeholder="Ej: Juan Pérez" style="width: 100%; padding: 14px; margin-top: 5px; background: #111111; border: 1px solid #333333; border-radius: 4px; color: #ffffff; font-size: 16px; box-sizing: border-box; font-family: 'Inter', sans-serif;">
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-size: 14px; color: #a0a0a0; font-family: 'Inter', sans-serif;">Número de WhatsApp:</label>
                <input type="tel" id="telefonoCliente" placeholder="Ej: 1123456789" style="width: 100%; padding: 14px; margin-top: 5px; background: #111111; border: 1px solid #333333; border-radius: 4px; color: #ffffff; font-size: 16px; box-sizing: border-box; font-family: 'Inter', sans-serif;">
            </div>

            <button onclick="consultarCruces()" class="btn-consultar">Ver mis cruces</button>
        </div>

        <!-- Panel de Resultados (Oculto inicialmente) -->
        <div id="panelCruces" style="display: none;">
            <h3 style="color: #f5f5f5; font-weight: 400; margin-bottom: 5px;">¡Hola, <span id="nombreDisplay" style="color: #c5a059;"></span>!</h3>
            <p style="margin-bottom: 10px;">Tus cruces actuales:</p>
            
            <div id="cartonCruces" style="font-size: 24px; letter-spacing: 4px; margin: 20px 0; background: #111111; padding: 15px; border-radius: 4px; border: 1px solid #333333;">❌ ❌ ⭕ ⭕ ⭕ ⭕ ⭕ ⭕</div>
            
            <p id="mensajePremio" style="margin-top: 10px; font-size: 15px;"></p>
            
            <button onclick="reiniciarConsulta()" class="btn-volver" style="margin-top: 20px;">Consultar otro número</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEX0VO5yl_rEdIShKG3J3mSSJR2EGLLY",
            authDomain: "agenciasweb.firebaseapp.com",
            projectId: "agenciasweb",
            storageBucket: "agenciasweb.appspot.com",
            messagingSenderId: "925400163595",
            appId: "1:925400163595:web:867847260d16f43c80ea86",
            measurementId: "G-BN4WEATHER"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.reiniciarConsulta = function() {
            document.getElementById('panelCruces').style.display = 'none';
            document.getElementById('form-registro').style.display = 'block';
            document.getElementById('telefonoCliente').value = '';
            document.getElementById('nombreCliente').value = '';
        }

        window.consultarCruces = async function() {
            const nombreInput = document.getElementById('nombreCliente').value.trim();
            const telefonoInput = document.getElementById('telefonoCliente').value.trim();
            const telefonoLimpio = telefonoInput.replace(/\D/g, '');

            if (!nombreInput) {
                alert("Por favor ingresa tu nombre.");
                return;
            }

            if (!telefonoLimpio || telefonoLimpio.length < 10) {
                alert("Por favor ingresa un número de WhatsApp válido (mínimo 10 dígitos).");
                return;
            }

            const btnConsultar = document.querySelector('.btn-consultar');
            const textoOriginal = btnConsultar.innerText;
            btnConsultar.innerText = "Buscando...";
            btnConsultar.disabled = true;

            try {
                const docRef = doc(db, "clientes", telefonoLimpio);
                const docSnap = await getDoc(docRef);

                let crucesActuales = 0;

                if (docSnap.exists()) {
                    crucesActuales = docSnap.data().cruces || 0;
                    // Actualizamos el nombre por si lo cambió, manteniendo sus cruces
                    await setDoc(docRef, { nombre: nombreInput, cruces: crucesActuales }, { merge: true });
                } else {
                    // Nuevo cliente: se crea con 0 cruces
                    await setDoc(docRef, { nombre: nombreInput, cruces: 0 });
                    crucesActuales = 0;
                }

                document.getElementById('form-registro').style.display = 'none';
                document.getElementById('panelCruces').style.display = 'block';
                document.getElementById('nombreDisplay').innerText = nombreInput;

                actualizarVisualCarton(crucesActuales);

            } catch (error) {
                console.error("Error al conectar con Firebase: ", error);
                alert("Hubo un error al consultar tus datos. Verificá tu conexión.");
            } finally {
                btnConsultar.innerText = textoOriginal;
                btnConsultar.disabled = false;
            }
        }

        function actualizarVisualCarton(cantidad) {
            const totalEspacios = 8;
            let cartonHTML = "";
            for (let i = 0; i < totalEspacios; i++) {
                if (i < cantidad) {
                    cartonHTML += "❌ "; 
                } else {
                    cartonHTML += "⭕ "; 
                }
            }
            document.getElementById('cartonCruces').innerText = cartonHTML;

            const mensaje = document.getElementById('mensajePremio');
            if (cantidad >= totalEspacios) {
                mensaje.innerText = "🎉 ¡Felicidades! Tenés una compra GRATIS para canjear en el local.";
                mensaje.style.color = "#4CD964";
            } else {
                mensaje.innerText = `Te faltan ${totalEspacios - cantidad} cruces para tu premio.`;
                mensaje.style.color = "#a0a0a0";
            }
        }
    </script>
</body>
</html>
